# XcodeGen spec. The .xcodeproj is generated on CI (and locally on a Mac) with `xcodegen generate`;
# it is not committed.
name: FrameworkApp
options:
  bundleIdPrefix: com.chadjara
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: NO
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES

packages:
  FrameworkKit:
    path: Packages/FrameworkKit

targets:
  FrameworkApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/Content"
          - "Resources/Content/**"
          - "Info.plist"
          - "FrameworkApp.entitlements"
          - "Resources/PrivacyInfo.xcprivacy"
      - path: App/Resources/Content
        type: folder
        buildPhase: resources
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: FrameworkKit
        product: FrameworkKit
      - package: FrameworkKit
        product: DesignTokens
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FrameworkApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take photos to keep as evidence for a requirement. Photos are stored only on this device.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/FrameworkApp.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chadjara.securityframeworks
        PRODUCT_NAME: FrameworkApp
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

  FrameworkAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: FrameworkApp
      - package: FrameworkKit
        product: FrameworkKit
      - package: FrameworkKit
        product: DesignTokens
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chadjara.securityframeworks.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FrameworkApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FrameworkApp
        BUNDLE_LOADER: $(TEST_HOST)

  FrameworkAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: FrameworkApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chadjara.securityframeworks.uitests
        TEST_TARGET_NAME: FrameworkApp

schemes:
  FrameworkApp:
    build:
      targets:
        FrameworkApp: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - FrameworkAppTests
        - FrameworkAppUITests
    archive:
      config: Release
